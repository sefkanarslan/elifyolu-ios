name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned, device)
        run: |
          xcodebuild -project ElifYolu.xcodeproj -scheme ElifYolu -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/ElifYolu.app
          test -f "$APP/www/index.html"
          test -f "$APP/www/audio/a/001001.mp3"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|DisplayName|ShortVersionString)"
          lipo -info "$APP/ElifYolu"
          plutil -p "$APP/Info.plist" | grep -E "NS(Microphone|SpeechRecognition)UsageDescription"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry ElifYolu-1.2-unsigned.ipa Payload
          ls -la ElifYolu-1.2-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ElifYolu-ipa
          path: ElifYolu-1.2-unsigned.ipa
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.2 --yes --cleanup-tag 2>/dev/null || true
          gh release create v1.2 ElifYolu-1.2-unsigned.ipa --title "Elif Yolu 1.2 (iOS)" \
            --notes "İmzasız IPA. Windows/Mac'te Sideloadly ile kendi Apple ID'nle imzalayıp kur."
