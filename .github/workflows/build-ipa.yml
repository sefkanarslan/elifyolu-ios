name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned, device)
        run: |
          xcodebuild -project ElifYolu.xcodeproj -scheme ElifYolu -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          APP=build/Build/Products/Release-iphoneos/ElifYolu.app
          test -f "$APP/www/index.html"
          test -f "$APP/www/audio/a/001001.mp3"
          plutil -p "$APP/Info.plist" | grep -E "CFBundle(Identifier|DisplayName|ShortVersionString)"
          lipo -info "$APP/ElifYolu"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry ElifYolu-1.1-unsigned.ipa Payload
          ls -la ElifYolu-1.1-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ElifYolu-ipa
          path: ElifYolu-1.1-unsigned.ipa
